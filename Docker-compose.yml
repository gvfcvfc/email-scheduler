services:
    app:
        build: . 
        container_name: email_scheduler_app
        restart: always
        depends_on:
            - db
            - redis
            - mlflow
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - .:/app
    mlflow:
        build: .
        container_name: email_scheduler_mlflow
        restart: always
        entrypoint: ["mlflow"]
        command:
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
            - --default-artifact-root
            - /mlflow/artifacts
        ports:
            - "5000:5000"
        volumes:
            - mlflow_data:/mlflow
    celery_worker:
       build: . 
       container_name: email_scheduler_worker
       restart: always
       command: celery -A app.celery_app.celery_app worker -n email_worker  --loglevel=info
       depends_on:
            - db
            - redis
       env_file:
            - .env
       volumes:
            - .:/app

    redis:
        image: redis:7
        container_name: email_scheduler_redis
        restart: always
        ports:
            - "6379:6379"
             
    db:
        image: postgres:15
        container_name: email_scheduler_db
        restart: always
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
    flower:
        image: mher/flower
        container_name: email_scheduler_flower
        restart: always
        command: celery --broker=redis://redis:6379/0 flower --port=5555

        ports:
            - "5555:5555"
        depends_on:
            - redis
            - celery_worker
    celery_beat:
        build: .
        container_name: email_scheduler_beat
        restart: always
        command: celery -A app.celery_app.celery_app beat --loglevel=info
        depends_on:
            - db
            - redis
        env_file:
            - .env
        volumes:
            - .:/app
    streamlit:
        build: .
        container_name: email_scheduler_streamlit
        restart: always
        command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
        ports:
            - "8501:8501"
        volumes:
            - .:/app    
    minio:
        image: minio/minio:latest
        container_name: email_scheduler_minio
        restart: always
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        env_file:
           - .env
        volumes:
            - minio_data:/data
        
    minio_init:
        image: minio/mc:latest
        container_name: email_scheduler_minio_init
        depends_on:
            - minio
        entrypoint: >
            /bin/sh -c "
            until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 1; done;
            mc mb -p local/uploads || true;
            mc anonymous set none local/uploads || true;
            exit 0;
            "
        
volumes:
    postgres_data:
    minio_data:
    mlflow_data:


           

 

