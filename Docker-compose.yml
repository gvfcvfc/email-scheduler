services:
    app:
        build: . 
        container_name: email_scheduler_app
        restart: always
        depends_on:
            - db
            - redis
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - .:/app
    celery_worker:
       build: . 
       container_name: email_scheduler_worker
       restart: always
       command: celery -A app.celery_app.celery_app worker -n email_worker  --loglevel=info
       depends_on:
            - db
            - redis
       env_file:
            - .env
       volumes:
            - .:/app

    redis:
        image: redis:7
        container_name: email_scheduler_redis
        restart: always
        ports:
            - "6379:6379"
             
    db:
        image: postgres:15
        container_name: email_scheduler_db
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: email_scheduler
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
    flower:
        image: mher/flower
        container_name: email_scheduler_flower
        restart: always
        command: celery --broker=redis://redis:6379/0 flower --port=5555

        ports:
            - "5555:5555"
        depends_on:
            - redis
            - celery_worker
    celery_beat:
        build: .
        container_name: email_scheduler_beat
        restart: always
        command: celery -A app.celery_app.celery_app beat --loglevel=info
        depends_on:
            - db
            - redis
        env_file:
        - .env
volumes:
    postgres_data:

           



